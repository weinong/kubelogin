apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://mixed-auth-cluster.region.azmk8s.io:443
  name: mixed-auth-cluster
contexts:
- context:
    cluster: mixed-auth-cluster
    user: legacy-user
  name: legacy-context
- context:
    cluster: mixed-auth-cluster
    user: exec-user
  name: exec-context
- context:
    cluster: mixed-auth-cluster
    user: token-user
  name: token-context
current-context: legacy-context
kind: Config
preferences: {}
users:
- name: legacy-user
  user:
    auth-provider:
      config:
        apiserver-id: 6dae42f8-4368-4678-94ff-3960e28e3630
        client-id: 80faf920-1908-4b52-b5ef-a8e7bedfc67a
        config-mode: "1"
        environment: AzurePublicCloud
        tenant-id: 84cff436-d6b3-4e81-9ecd-cab809615c5c
      name: azure
- name: exec-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 6dae42f8-4368-4678-94ff-3960e28e3630
      - --client-id
      - 80faf920-1908-4b52-b5ef-a8e7bedfc67a
      - --tenant-id
      - 84cff436-d6b3-4e81-9ecd-cab809615c5c
      - --login
      - devicecode
      command: kubelogin
      env: null
      installHint: |
        kubelogin is not installed which is required to connect to AAD enabled cluster.
        To learn more, please go to https://aka.ms/aks/kubelogin
      provideClusterInfo: false
- name: token-user
  user:
    token: some-static-token-value
