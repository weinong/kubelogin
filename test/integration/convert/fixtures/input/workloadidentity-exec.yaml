apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://workload-identity-cluster.region.azmk8s.io:443
  name: workload-identity-cluster
contexts:
- context:
    cluster: workload-identity-cluster
    user: workload-identity-user
  name: workload-identity-context
current-context: workload-identity-context
kind: Config
preferences: {}
users:
- name: workload-identity-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 6dae42f8-4368-4678-94ff-3960e28e3630
      - --client-id
      - 80faf920-1908-4b52-b5ef-a8e7bedfc67a
      - --tenant-id
      - 84cff436-d6b3-4e81-9ecd-cab809615c5c
      - --federated-token-file
      - /var/run/secrets/azure/tokens/azure-identity-token
      - --login
      - workloadidentity
      command: kubelogin
      env: null
      installHint: |
        kubelogin is not installed which is required to connect to AAD enabled cluster.
        To learn more, please go to https://aka.ms/aks/kubelogin
      provideClusterInfo: false
