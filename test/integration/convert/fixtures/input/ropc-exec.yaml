apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://ropc-test-cluster.region.azmk8s.io:443
  name: ropc-test-cluster
contexts:
- context:
    cluster: ropc-test-cluster
    user: ropc-test-user
  name: ropc-test-context
current-context: ropc-test-context
kind: Config
preferences: {}
users:
- name: ropc-test-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 6dae42f8-4368-4678-94ff-3960e28e3630
      - --client-id
      - 80faf920-1908-4b52-b5ef-a8e7bedfc67a
      - --username
      - testuser@example.com
      - --tenant-id
      - 84cff436-d6b3-4e81-9ecd-cab809615c5c
      - --login
      - ropc
      command: kubelogin
      env: null
      installHint: |
        kubelogin is not installed which is required to connect to AAD enabled cluster.
        To learn more, please go to https://aka.ms/aks/kubelogin
      provideClusterInfo: false
